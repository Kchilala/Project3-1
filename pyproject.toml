[project]
name = "wifi-csi-presence-detection"
version = "0.1.0"
description = "Wi-Fi CSI presence and motion detection: reproduced HAR models (LSTM-CNN, BiLSTM, InceptionTime, PA-CSI) and an ESP32 pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "PyWavelets",
    "matplotlib",
    "jupyterlab",
    "ipykernel",
    "nbformat",
    "nbconvert",
    "gdown",
]
